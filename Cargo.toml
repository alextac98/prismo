[workspace]
members = [
    "crates/core",
    "crates/plugin-host",
    "crates/plugin-protocol",
    "crates/plugin-sdk/cpp",
    "crates/plugin-sdk/rust",
    "crates/tui",
    "app",
    "plugins/example-rust",
    "tools/homepage-demo",
    "tools/ffi",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
crossterm = "0.29"
diplomat = "0.10.0"
diplomat-tool = "0.10.0"
diplomat-runtime = "0.10.0"
prost = "0.14"
rand = "0.9"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
