name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v6

      - name: Set Up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Bazel Build All
        run: bazel build //...

      - name: Bazel Test All
        run: bazel test //...

  release:
    name: Release
    needs: build_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Check Out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Version Change
        id: version
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 tools/release/detect_version_change.py >> "$GITHUB_OUTPUT"

      - name: Check Existing Release
        id: release
        if: steps.version.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: tools/release/check_existing_release.sh >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        if: steps.version.outputs.version_changed == 'true' && steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: tools/release/create_github_release.sh

      - name: Create Release Archive
        id: archive
        if: steps.version.outputs.version_changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/release/create_release_archive.sh

      - name: Upload Release Archive
        if: steps.version.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET_PATH: ${{ steps.archive.outputs.archive_path }}
        run: tools/release/upload_release_asset.sh

      - name: Release Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
          VERSION_CHANGED: ${{ steps.version.outputs.version_changed }}
          RELEASE_EXISTS: ${{ steps.release.outputs.exists || 'false' }}
        run: tools/release/write_release_summary.sh >> "$GITHUB_STEP_SUMMARY"

  publish_bcr:
    name: Publish to Bazel Central Registry
    needs: release
    if: needs.release.outputs.version_changed == 'true'
    permissions:
      contents: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.2.0
    with:
      tag_name: ${{ needs.release.outputs.tag }}
      registry_fork: ${{ github.repository_owner }}/bazel-central-registry
      attest: false
      environment: Publish
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
